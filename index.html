<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12344D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="On Tour">
<title>JD &amp; Santi On Tour · Juan David y Santiago</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="stylesheet" href="css/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/gastos.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo" aria-hidden="true"><span>JD</span><span>S</span></div><div><h1>JD &amp; Santi <em>On Tour</em></h1><p>Juan David y Santiago · 30 oct – 24 nov 2026</p></div></div>
  <button class="topbtn" id="pcBtn" type="button" aria-label="Pantalla completa" title="Pantalla completa" hidden>⛶</button>
  <div class="seg" role="group" aria-label="Número de personas"><span>Personas</span><button data-g="1">1</button><button data-g="2" class="on">2</button><button data-g="3">3</button><button data-g="4">4</button></div>
</header>

<main>
<section class="view on" id="v-inicio"></section>
<section class="view" id="v-dias"></section>
<section class="view" id="v-mapa">
  <nav class="chips" id="cityChips" aria-label="Ciudades"></nav>
  <nav class="chips" id="filterChips" aria-label="Filtro"></nav>
  <nav class="chips daychips" id="dayChips" aria-label="Ruta del día"></nav>
  <div class="layout">
    <div class="mapwrap"><div id="map"></div><div id="lmap"></div>
      <button class="mode" id="mode" type="button" title="Cambiar entre satélite y mapa dibujado">✏️ Mapa dibujado ⇄</button>
      <div class="layers"><button id="zIn" aria-label="Acercar">+</button><button id="zOut" aria-label="Alejar">−</button><button id="zReset" aria-label="Centrar" title="Centrar">⌖</button><button id="cercaBtn" aria-label="Cerca de mí" title="Lo más cercano a mí">📍</button><button id="fullBtn" aria-label="Pantalla completa" title="Pantalla completa">⛶</button><button id="tour" class="play" aria-label="Recorrido">▶<span class="lbl"> Recorrido</span></button></div>
      <div class="scale" id="scale"><span id="scaleT">—</span><i id="scaleB"></i></div>
      <div class="navbanner" id="navBanner" role="status" aria-live="polite" hidden></div>
      <div class="fabs"><button id="fabCasa" aria-label="Volver a casa" title="Volver a casa">🏠</button><button id="fabYo" aria-label="Mi ubicación" title="Mi ubicación">◎</button></div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</section>
<section class="view" id="v-comer"></section>
<section class="view" id="v-ingles"></section>
<section class="view" id="v-fotos"></section>
<section class="view" id="v-gratis"></section>
<section class="view" id="v-gastos"></section>
</main>

<nav class="tabs" id="tabs" aria-label="Secciones">
  <button data-t="inicio" class="on"><span class="ic">🏠</span>Inicio</button>
  <button data-t="dias"><span class="ic">🗓️</span>Días</button>
  <button data-t="mapa"><span class="ic">🗺️</span>Mapa</button>
  <button data-t="gastos"><span class="ic">💸</span>Gastos</button>
  <button data-t="comer"><span class="ic">🍕</span>Comer</button>
  <button data-t="ingles"><span class="ic">🗣️</span>Inglés</button>
  <button data-t="fotos"><span class="ic">📸</span>Fotos</button>
  <button data-t="gratis"><span class="ic">🎟️</span>Gratis</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/datos/lugares.js"></script>
<script src="js/datos/ciudades.js"></script>
<script src="js/datos/presupuesto.js"></script>
<script src="js/datos/dias.js"></script>
<script src="js/plan.js"></script>
<script src="js/datos/contenido.js"></script>
<script src="js/datos/ingles.js"></script>
<script src="js/datos/mapas.js"></script>
<script src="js/datos/restaurantes.js"></script>
<script src="js/datos/planes-extra.js"></script>
<script src="js/offline.js"></script>
<script src="js/datos/horarios.js"></script>
<script src="js/rutas.js"></script>
<script src="js/cronograma.js"></script>
<script src="js/hoy.js"></script>
<script src="js/mapa-rutas.js"></script>
<script src="js/navegar.js"></script>
<script src="js/vista-dias.js"></script>
<script src="js/comer.js"></script>
<script src="js/extras.js"></script>
<script src="js/ingles.js"></script>
<script src="js/gastos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
